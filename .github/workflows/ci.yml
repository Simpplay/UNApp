name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (core)
        run: pnpm --filter @unapp/core run typecheck

      - name: Typecheck (web)
        run: pnpm --filter @unapp/web run typecheck

      - name: Test (core)
        run: pnpm --filter @unapp/core run test

      - name: Test (web)
        run: pnpm --filter @unapp/web run test

      - name: Build (web)
        run: pnpm --filter @unapp/web run build
